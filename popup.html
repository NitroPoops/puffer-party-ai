<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Puffer AI Settings</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #38bdf8;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: #cbd5e1;
    }
    select, input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
      padding: 7px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    .saved {
      margin-top: 8px;
      font-size: 12px;
      color: #4ade80;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h3>Puffer AI Settings</h3>

  <label for="provider">AI Provider</label>
  <select id="provider">
    <option value="openai">OpenAI (gpt-6.1-terra default)</option>
    <option value="gemini">Google Gemini (gemini-3.8-flash default)</option>
  </select>

  <label for="apiKey">API Key</label>
  <input type="password" id="apiKey" placeholder="sk-... or AIza..." />

  <label for="model">Model Override (optional)</label>
  <input type="text" id="model" placeholder="Leave blank for fast default" />

  <button id="saveBtn">Save Settings</button>
  <div class="saved" id="savedMsg"></div>

  <script src="popup.js"></script>
</body>
</html>
